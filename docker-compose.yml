# Gargantua — local vertical slice.
#
# Brings up the agent-creation flow end to end WITHOUT Kubernetes:
#
#   browser ─▶ studio (nginx SPA + /api proxy)
#                 └─▶ studio-backend (BFF, builds gargantua.ai/v1 manifests)
#                        └─▶ control-plane (Registry + Catalog)
#                               ├─▶ postgres  (control-plane + studio state)
#                               └─▶ minio     (bundle manifest blobs)
#
# The core 5 services above are the "does Studio emit something compatible?" slice.
# Optionally, the `agent-runtime` profile adds a second loop — actually RUNNING an
# agent bundle, end to end, with a real (local, no external API key) LLM:
#
#   runtime (agent-runtime image, GARGANTUA_BUNDLE=./examples/hello-agent)
#      └─▶ ollama (local model, OpenAI-compatible endpoint — no external API key)
#
# Bring it up with:  docker compose --profile agent-runtime up -d --build --wait
# Mongo/Redis are still not part of this: the runtime uses the `embedded` Spring
# profile (in-memory state), matching "try it in 60 seconds" from getting-started.md.
#
# Build contexts point at the sibling source repos, so check them out next to this one
# (see README). The JVM images build the shared agent-core FROM SOURCE (via the
# `runtime_src` named build context = ../gargantua), so no Maven Central release of
# agent-core is needed — but the `gargantua` Runtime repo MUST be checked out as a sibling.

name: gargantua

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gargantua} -d ${POSTGRES_DB:-gargantua}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: kept on the internal network to avoid clashing with a host Postgres.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      # Published high to avoid clashing with Cave's own minio on 9000/9001.
      - "${MINIO_API_PORT:-19000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-19001}:9001" # web console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-plane:
    build:
      context: ../gargantua-control-plane
      additional_contexts:
        # agent-core is built from source (no Maven Central release needed).
        runtime_src: ../gargantua
    environment:
      # The S3BlobStore auto-creates the bucket on first write, so no init job is needed.
      SPRING_PROFILES_ACTIVE: postgres,minio
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gargantua-bundles}
    ports:
      # Published high to avoid clashing with Cave's service on 8080.
      - "${CONTROL_PLANE_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  studio-backend:
    build:
      context: ../gargantua-studio-backend
      additional_contexts:
        runtime_src: ../gargantua
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
      GARGANTUA_CONTROL_PLANE_BASE_URL: http://control-plane:8080
    ports:
      - "${STUDIO_BACKEND_PORT:-18090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  studio:
    build:
      context: ../gargantua-studio
      args:
        # Empty = same-origin: the SPA calls /api and /actuator, nginx proxies them to
        # studio-backend. Host-agnostic, so the site works on localhost or a LAN IP.
        VITE_STUDIO_API: ""
    ports:
      - "${STUDIO_PORT:-18081}:80"
    depends_on:
      studio-backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: this nginx image only listens on IPv4 (no `listen [::]:80`
      # in nginx.conf), and `localhost` resolves to ::1 first inside the container.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── optional: `--profile agent-runtime` ──────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    profiles: ["agent-runtime"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-19434}:11434"
    healthcheck:
      # The ollama image ships neither wget nor curl — use its own CLI, which hits the
      # local API. `ollama list` succeeds once the server is accepting requests.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: pulls the demo model, then exits. `runtime` waits for it to succeed.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["agent-runtime"]
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  runtime:
    profiles: ["agent-runtime"]
    build:
      # Build context is this repo (bakes ./examples/hello-agent into the image at build
      # time — a bind mount can't work when the daemon is remote). The Runtime source is
      # the `runtime_src` named context.
      context: .
      dockerfile: runtime.Dockerfile
      additional_contexts:
        runtime_src: ../gargantua
    environment:
      SPRING_PROFILES_ACTIVE: embedded
      ROUTING_STRATEGY: semantic   # ONNX embeddings only — no LLM call needed to route
      LLM_PRIMARY_PROVIDER: openai # Ollama exposes an OpenAI-compatible /v1 endpoint
      LLM_PRIMARY_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      LLM_PRIMARY_ENDPOINT: http://ollama:11434/v1
      LLM_PRIMARY_API_KEY: ollama # unused by Ollama, but the client requires a non-empty value
    ports:
      - "${RUNTIME_PORT:-18100}:8080"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  miniodata:
  ollamadata:
