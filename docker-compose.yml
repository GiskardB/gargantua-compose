# Gargantua — local vertical slice.
#
# Brings up the agent-creation flow end to end WITHOUT Kubernetes:
#
#   browser ─▶ studio (ONE image: Spring serves the SPA at / and the BFF API at /api)
#                 └─▶ control-plane (Registry + Catalog)
#                        ├─▶ postgres  (control-plane + studio state)
#                        └─▶ minio     (bundle manifest blobs)
#
# The core 4 services above are the "does Studio emit something compatible?" slice.
# Optionally, the `agent-runtime` profile adds a second loop — actually RUNNING an
# agent bundle, end to end, with a real (local, no external API key) LLM:
#
#   runtime (agent-runtime image, GARGANTUA_BUNDLE=./examples/hello-agent)
#      └─▶ ollama (local model, OpenAI-compatible endpoint — no external API key)
#
# Bring it up with:  docker compose --profile agent-runtime up -d --build --wait
# Mongo/Redis are still not part of this: the runtime uses the `embedded` Spring
# profile (in-memory state), matching "try it in 60 seconds" from getting-started.md.
#
# Build contexts point at the sibling source repos, so check them out next to this one
# (see README). The JVM images build the shared agent-core FROM SOURCE (via the
# `runtime_src` named build context = ../gargantua), so no Maven Central release of
# agent-core is needed — but the `gargantua` Runtime repo MUST be checked out as a sibling.

name: gargantua

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gargantua} -d ${POSTGRES_DB:-gargantua}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: kept on the internal network to avoid clashing with a host Postgres.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      # Published high to avoid clashing with Cave's own minio on 9000/9001.
      - "${MINIO_API_PORT:-19000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-19001}:9001" # web console
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-plane:
    build:
      context: ../gargantua-control-plane
      additional_contexts:
        # agent-core is built from source (no Maven Central release needed).
        runtime_src: ../gargantua
    environment:
      # The S3BlobStore auto-creates the bucket on first write, so no init job is needed.
      SPRING_PROFILES_ACTIVE: postgres,minio
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-gargantua-bundles}
    ports:
      # Published high to avoid clashing with Cave's service on 8080.
      - "${CONTROL_PLANE_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Studio = frontend + backend in ONE image (Spring serves the SPA at / and /api on the
  # same origin — no separate nginx). Build context is the merged gargantua-studio repo.
  studio:
    build:
      context: ../gargantua-studio
      additional_contexts:
        runtime_src: ../gargantua
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-gargantua}
      POSTGRES_USER: ${POSTGRES_USER:-gargantua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gargantua}
      GARGANTUA_CONTROL_PLANE_BASE_URL: http://control-plane:8080
      # The Launch button shells out to this. A plain `docker run` (not compose) so it works
      # with a remote daemon — no compose file / build context needed in this container, only
      # a pre-built gargantua-runtime:local image. {name}/{version} are substituted (validated).
      GARGANTUA_LAUNCH_COMMAND_TEMPLATE: >-
        docker rm -f gargantua-runtime 2>/dev/null;
        docker run -d --name gargantua-runtime --network gargantua_default -p ${RUNTIME_PORT:-18100}:8080
        -e GARGANTUA_BUNDLE_URL=http://control-plane:8080/api/v1/registry/bundles/{name}/{version}/bundle
        -e SPRING_PROFILES_ACTIVE=embedded -e ROUTING_STRATEGY=semantic
        -e LLM_PRIMARY_PROVIDER=openai -e LLM_PRIMARY_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
        -e LLM_PRIMARY_ENDPOINT=http://ollama:11434/v1 -e LLM_PRIMARY_API_KEY=ollama
        -e AGENT_WEB_CORS_ALLOWED_ORIGINS=http://localhost:${STUDIO_PORT:-18081}
        gargantua-runtime:local
      GARGANTUA_LAUNCH_WORKDIR: /app
      # Reach the Docker daemon the same way Cave's shell does (remote TCP via socket-proxy);
      # falls back to the mounted docker.sock on a standard local Docker install.
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    ports:
      - "${STUDIO_PORT:-18081}:8090"
    networks:
      - default
      - cave
    volumes:
      # Fallback for a local Docker daemon; ignored when DOCKER_HOST points at a remote one.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── optional: `--profile agent-runtime` ──────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    profiles: ["agent-runtime"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-19434}:11434"
    healthcheck:
      # The ollama image ships neither wget nor curl — use its own CLI, which hits the
      # local API. `ollama list` succeeds once the server is accepting requests.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-shot: pulls the demo model, then exits. `runtime` waits for it to succeed.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["agent-runtime"]
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  runtime:
    profiles: ["agent-runtime"]
    # Tagged so the Studio Launch button can `docker run` this exact image (it can't build
    # from the studio-backend container against a remote daemon). Build it once with:
    #   docker compose --profile agent-runtime build runtime
    image: gargantua-runtime:local
    build:
      # The Runtime source is the `runtime_src` named context. No bundle is baked in anymore —
      # the runtime FETCHES its bundle from the Control Plane via GARGANTUA_BUNDLE_URL.
      context: .
      dockerfile: runtime.Dockerfile
      additional_contexts:
        runtime_src: ../gargantua
    environment:
      # Fetch the published bundle from the Control Plane (defaults to the seeded hello-agent).
      GARGANTUA_BUNDLE_URL: http://control-plane:8080/api/v1/registry/bundles/${GARGANTUA_BUNDLE_NAME:-hello-agent}/${GARGANTUA_BUNDLE_VERSION:-1.0.0}/bundle
      SPRING_PROFILES_ACTIVE: embedded
      ROUTING_STRATEGY: semantic   # ONNX embeddings only — no LLM call needed to route
      LLM_PRIMARY_PROVIDER: openai # Ollama exposes an OpenAI-compatible /v1 endpoint
      LLM_PRIMARY_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      LLM_PRIMARY_ENDPOINT: http://ollama:11434/v1
      LLM_PRIMARY_API_KEY: ollama # unused by Ollama, but the client requires a non-empty value
      AGENT_WEB_CORS_ALLOWED_ORIGINS: http://localhost:${STUDIO_PORT:-18081}
    ports:
      - "${RUNTIME_PORT:-18100}:8080"
    # Retry until the bundle is published (the seed script / a Studio publish): a missing
    # bundle exits the process, and on-failure brings it back once the bundle exists.
    restart: on-failure
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

networks:
  default:
  # Cave's shared network, where socket-proxy (the Docker daemon endpoint) lives. External
  # so studio-backend can reach it to run the Launch command. On a non-Cave host this network
  # may not exist — remove this block and the studio-backend `cave` entry, and rely on the
  # docker.sock mount instead.
  cave:
    external: true

volumes:
  pgdata:
  miniodata:
  ollamadata:
